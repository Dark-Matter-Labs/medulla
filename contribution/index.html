<style>
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url("/assets/fonts/instrument-serif-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url("/assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/assets/fonts/instrument-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:500;font-display:swap;src:url("/assets/fonts/instrument-sans-latin-500-normal.woff2") format("woff2")}

:root{--bg:#E5E5E5;--ink:#000;--muted:#3f3f3f;--warn:#B3261E;--ya:#FFB62F;--yb:#FFCF76;
  --display:"Instrument Serif",Georgia,serif;--text:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--text);-webkit-font-smoothing:antialiased}
a.skip{position:absolute;left:-999px}a.skip:focus{left:16px;top:16px}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:min(420px,100%);padding:28px 24px 22px;border-radius:4px;background:var(--bg);border-top:4px solid var(--ya);box-shadow:0 0 12px 0 rgba(31,33,52,.32)}
.kind{font:500 12px/1 var(--text);letter-spacing:.08em;text-transform:uppercase}
h1{font:400 clamp(30px,9vw,40px)/.95 var(--display);white-space:nowrap;text-transform:uppercase;margin:12px 0 10px}
p{margin:0 0 18px}
label{display:block;font:500 12px/1.3 var(--text);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
input[type=password]{width:100%;font:16px/1.3 var(--text);padding:12px 14px;border:1px solid #000;border-radius:4px;background:#fff;color:#000}
button{margin-top:14px;font:500 15px/1 var(--text);background:#000;color:#fff;border:0;border-radius:4px;padding:13px 22px;min-height:44px;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
input:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:2px}
.msg{min-height:1.6em;margin-top:12px;font-size:14px;color:var(--warn)}
.foot{margin-top:24px;font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<a class="skip" href="#pw">Skip to password</a>
<main id="main">
  <form class="box" id="f" autocomplete="on">
    <span class="kind">Private</span>
    <img src="/assets/logos/medulla-short.svg" alt="Medulla" width="112" height="112" style="display:block;margin:0 0 18px">
    <h1>Contribution Model</h1>
    <p>Enter the password to open it.</p>
    <input type="text" name="username" value="Medulla" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Open</button>
    <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
    <div class="foot">Nothing here is readable without the password, and nothing is sent anywhere.</div>
  </form>
</main>
