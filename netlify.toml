# Netlify publishes only the website's own files. The repo keeps its flat
# layout (so `npx serve .` and the tests keep working from the root); the
# build copies an allowlist into _site/, and only _site/ is deployed. Docs,
# tests, tooling and this file stay out of the public site.
#
# New public top-level files or folders must be added to the cp line below.
# Root *.html is copied by glob, so new pages are picked up automatically.

[build]
  publish = "_site"
  command = """
    rm -rf _site && mkdir _site \
    && cp -R *.html styles scripts assets _site/ \
    && find _site -name '.DS_Store' -delete \
    && echo '*' > _site/.gitignore
  """

# Fonts are cached for a year. File names are not content-hashed, so never
# overwrite a font in place: give a changed font a new file name (and update
# the @font-face / preload references), or returning visitors keep the old one.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
